
name: DucDuyExternalMenu

options:
  bundleIdPrefix: com.ducduy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  DucDuyExternalMenu:
    type: application
    platform: iOS
    sources:
      - path: DucDuyExternalMenuApp.swift
      - path: MenuView.swift

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: DucDuy Menu
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ducduy.externalmenu
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

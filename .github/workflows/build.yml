
name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Device app
        run: |
          xcodebuild \
            -project DucDuyExternalMenu.xcodeproj \
            -scheme DucDuyExternalMenu \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check iOS Device Build
  run: |
    APP_PATH="build/Build/Products/Release-iphoneos/DucDuyExternalMenu.app"
    if [ ! -d "$APP_PATH" ]; then
      echo "App not found at: $APP_PATH"
      echo "Available build products:"
      find build/Build/Products -maxdepth 3 -name "*.app" -print
      exit 1
    fi
    echo "Found app: $APP_PATH"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DucDuyExternalMenu-Simulator
          path: output/DucDuyExternalMenu-Simulator.zip

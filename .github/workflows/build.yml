
name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project DucDuyExternalMenu.xcodeproj \
            -scheme DucDuyExternalMenu \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/DucDuyExternalMenu.app"
          test -d "$APP_PATH"
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" output/DucDuyExternalMenu-Simulator.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DucDuyExternalMenu-Simulator
          path: output/DucDuyExternalMenu-Simulator.zip
